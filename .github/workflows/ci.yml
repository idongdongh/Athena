name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: Python 3.12 tests
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements.txt

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip uv
          uv venv --python 3.12
          uv pip install -r requirements.txt

      - name: Run unit tests
        run: uv run python -m unittest discover -s tests

      - name: Run Docker sandbox integration test
        env:
          ATHENA_RUN_DOCKER_TESTS: "1"
        run: uv run python -m unittest tests.test_docker_sandbox_integration

      - name: Compile Python sources
        run: >-
          uv run python -m compileall -q
          agent athena_cli evaluation tools cli.py run_agent.py session_db.py
